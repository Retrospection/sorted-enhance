name: macOS CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and verify installer
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile app and UI tests
        run: |
          xcodebuild -version
          xcodebuild -project SortedEnhance.xcodeproj -scheme SortedEnhance \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/debug" build-for-testing
      - name: Run task workflows on the hosted Mac
        run: |
          xcodebuild -project SortedEnhance.xcodeproj -scheme SortedEnhance \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/debug" \
            -parallel-testing-enabled NO \
            -skip-testing:SortedEnhanceUITests/PlannerWorkflowTests/testReplanAroundFixedEventAndPreserveCompletedWorkAfterRelaunch \
            test-without-building
      - name: Run planner tests
        run: scripts/test-planner.sh
      - name: Build and inspect universal package
        env:
          VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: scripts/build-installer.sh "$RUNNER_TEMP/installer" "$VERSION_TAG"
      - name: Stage release files
        if: github.ref_type == 'tag' && !github.event.deleted
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-installer
          path: ${{ runner.temp }}/installer/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-installer
          path: installer
      - name: Verify checksum and publish assets
        working-directory: installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="SortedEnhance-$TAG-macOS-universal.pkg"
          sha256sum --check "$package.sha256"
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "Release $TAG is already published." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes \
              --title "Sorted Enhance $TAG" "${flags[@]}" \
              --notes "Universal installer for macOS 14 or later. This build is not Developer ID signed or notarized."
          fi
          gh release upload "$TAG" "$package" "$package.sha256" --clobber
          gh release edit "$TAG" --draft=false "${flags[@]}"
