name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Agent prompt
        type: string
      name:
        description: Run name
        type: string

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pullfrog/pullfrog@0741f79ecebfa4469a010644d2aed2d96d32d489 # v0
        with:
          prompt: ${{ inputs.prompt }}
